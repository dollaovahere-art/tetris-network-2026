<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Network Arcade Suite</title>
    <!-- Connects directly to your server.js socket infrastructure -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --accent-color: #ff4757;
            --secondary-accent: #2f3542;
            --text-color: #ffffff;
            --sub-text: #c5a059;
            --chat-bg: #151a21;
            --gold: #f1c40f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 5px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Zero-scroll scaling on laptops & cellphones */
        }

        .hidden { display: none !important; }

        .auth-container, .lobby-container, .game-container {
            background: var(--panel-color);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 1100px;
            height: 96vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .auth-container { height: auto; max-width: 400px; justify-content: center; }

        .input-style {
            background: var(--secondary-accent);
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .btn-style {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-style:hover { background: #ff6b81; }
        .btn-style.secondary { background: #57606f; }
        .mode-select-style {
            background: var(--secondary-accent);
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
            flex: 1;
            overflow-y: auto;
        }

        /* Responsive Split Screen Workspace Setup */
        .arcade-split-workspace {
            display: flex;
            flex-direction: row;
            gap: 15px;
            width: 100%;
            flex: 1;
            min-height: 0;
            margin-top: 10px;
        }

        .game-column-left {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .chat-column-right {
            flex: 1;
            background: var(--chat-bg);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--secondary-accent);
            min-height: 0;
        }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            background: #000;
            padding: 8px;
            border-radius: 5px;
            font-family: monospace;
            text-align: left;
            margin-bottom: 8px;
        }

        .chat-msg { margin-bottom: 4px; font-size: 0.85rem; line-height: 1.3; }
        .user-tag { color: var(--accent-color); font-weight: bold; }

        .boards-layout-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex: 1;
            min-height: 0;
            width: 100%;
        }
        .canvas-wrapper {
            position: relative;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        canvas {
            background-color: #000;
            border: 2px solid var(--secondary-accent);
            border-radius: 6px;
            max-height: 65vh; /* Fits screen limits perfectly on laptop & mobile viewport */
            width: auto;
            aspect-ratio: 240 / 400;
        }

        .touch-controls-pad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 280px;
            margin-top: 5px;
        }

        .touch-btn {
            background: var(--secondary-accent);
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 10px 2px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }
        .touch-btn:active { background: var(--accent-color); }

        .game-choice-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            z-index: 10;
        }

        /* Leaderboard Specific Panel Styles */
        .leaderboard-widget-panel {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--secondary-accent);
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }
        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #222;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .rooms-grid { grid-template-columns: repeat(2, 1fr); }
            .arcade-split-workspace { flex-direction: column; }
            .chat-column-right { flex: 0.7; min-height: 0; }
            canvas { max-height: 42vh; }
        }
    </style>
</head>
<body>

    <!-- CHOOSE IDENTITY SIGN IN -->
    <div id="authScreen" class="auth-container">
        <h3 style="margin-top:0; text-align:center;">Tetris identity</h3>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <input type="text" id="usernameInput" class="input-style" placeholder="Enter Player Name...">
            <button class="btn-style" onclick="handleManualFormLogin()">Enter Arena</button>
        </div>
    </div>

    <!-- 10 MATCHMAKING ROOMS LOBBY SELECTION BOARD -->
    <div id="lobbyScreen" class="lobby-container hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <h4 style="margin:0;">Welcome, <span id="lobbyGreetingName" class="user-tag">Player</span>!</h4>
            <button class="btn-style secondary" style="padding: 4px 10px; font-size: 0.8rem;" onclick="handleSignOutAndForget()">Sign Out</button>
        </div>
        
        <!-- Persistent Server High Rankings Panel Board -->
        <div class="leaderboard-widget-panel">
            <h5 style="margin: 0 0 5px 0; color: var(--gold); text-align: center;">🏆 Global Arcade Leaderboard</h5>
            <div id="leaderboardRowsContainer">
                <div style="text-align:center; font-size:0.8rem; color:#888;">Fetching rank balances...</div>
            </div>
        </div>

        <p style="margin: 8px 0 2px 0; font-size: 0.85rem; font-weight: bold;">Select an arena channel to fill a seat:</p>
        <div class="rooms-grid">
            <button class="btn-style" onclick="enterRoomArena(1)">Join Room 101</button>
            <button class="btn-style" onclick="enterRoomArena(2)">Join Room 102</button>
            <button class="btn-style" onclick="enterRoomArena(3)">Join Room 103</button>
            <button class="btn-style" onclick="enterRoomArena(4)">Join Room 104</button>
            <button class="btn-style" onclick="enterRoomArena(5)">Join Room 105</button>
            <button class="btn-style" onclick="enterRoomArena(6)">Join Room 106</button>
            <button class="btn-style" onclick="enterRoomArena(7)">Join Room 107</button>
            <button class="btn-style" onclick="enterRoomArena(8)">Join Room 108</button>
            <button class="btn-style" onclick="enterRoomArena(9)">Join Room 109</button>
            <button class="btn-style" onclick="enterRoomArena(10)">Join Room 110</button>
        </div>
    </div>
    <!-- MAIN STRATEGIC GAMEPLAY WORKSPACE DISPLAY -->
    <div id="gameScreen" class="game-container hidden">
        <div class="room-controls-row" style="display: flex; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--secondary-accent); padding-bottom: 10px;">
            <div>
                <label for="modeSelect" style="font-weight: bold; margin-right: 3px; font-size: 0.85rem;">Mode:</label>
                <select id="modeSelect" class="mode-select-style" onchange="handleModeChange(this.value)">
                    <option value="single">Single Player Mode</option>
                    <option value="practice">Practice Mode</option>
                    <option value="competition">Competition (Versus)</option>
                </select>
            </div>
            
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="font-weight: bold; background: #000; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--accent-color); font-size: 0.85rem;">
                    Time Left: <span id="gameTimer" style="color: var(--accent-color);">02:00</span>
                </div>
                <p style="margin: 0; font-size: 0.8rem;">Players: <span id="roomPopulationCounter" style="font-weight: bold; color: var(--accent-color);">0</span></p>
                <button id="leaveRoomBtn" class="btn-style" style="padding: 4px 10px; font-size: 0.8rem;" onclick="leaveCurrentRoom()">Leave Room</button>
            </div>
        </div>

        <div class="arcade-split-workspace">
            <div class="game-column-left">
                <div class="boards-layout-container">
                    <div class="canvas-wrapper">
                        <h5 id="localPlayerHeader" style="margin: 2px 0; font-size: 0.85rem;">Your Grid</h5>
                        <canvas id="localCanvas" width="240" height="400"></canvas>
                        
                        <!-- Fixed: Removed "get up from seat", leaving play again button exclusively -->
                        <div id="lossOverlay" class="hidden game-choice-overlay">
                            <h4 style="color: var(--accent-color); margin: 0 0 10px 0;">ROUND COMPLETED</h4>
                            <button class="btn-style" style="width: 120px;" onclick="restartLocalGame()">Play Again</button>
                        </div>
                    </div>

                    <div id="opponentWrapper" class="canvas-wrapper hidden">
                        <h5 style="margin: 2px 0; font-size: 0.85rem;">Opponent Live Feed</h5>
                        <canvas id="opponentCanvas" width="240" height="400"></canvas>
                    </div>
                </div>

                <div class="touch-controls-pad">
                    <button class="touch-btn" onclick="handleMobileAction('LEFT')">◀ Left</button>
                    <button class="touch-btn" onclick="handleMobileAction('ROTATE')">🔄 Rotate</button>
                    <button class="touch-btn" onclick="handleMobileAction('DROP')"> Hard Drop</button>
                    <button class="touch-btn" onclick="handleMobileAction('RIGHT')">Right ▶</button>
                </div>
            </div>

            <!-- Fix: Cleared system tags, displays direct text messages from users exclusively -->
            <div class="chat-column-right">
                <h5 style="margin: 0 0 5px 0; border-bottom: 1px solid var(--secondary-accent); padding-bottom: 2px; color: var(--accent-color); font-size: 0.85rem;">Lobby Chat</h5>
                <div id="chatLog" class="chat-log"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="chatInput" class="input-style" placeholder="Type a message..." style="flex: 1; font-size: 0.8rem; padding: 6px;" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                    <button class="btn-style" style="padding: 0 12px; font-size: 0.8rem;" onclick="sendChatMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const socket = io();
        
        let currentUsername = "";
        let currentActiveRoomId = null;
        let selectedPlayMode = "single";
        let lastSelectedMode = "single";
        let gameActive = false;
        
        let matchTimerCountdownId = null;
        let gameTimeRemaining = 120;
        let gameEngineTickIntervalId = null;

        let currentGridMatrix = Array.from({length: 20}, () => Array(10).fill(0));
        let mockBlockX = 4; 
        let mockBlockY = 0; 
        let currentPlayerScore = 0;
        let currentLevel = 1;
        let totalLinesCleared = 0;
        let userChipsBalance = 250; 

        window.addEventListener('DOMContentLoaded', () => {
            const cachedUsername = localStorage.getItem('tetris_saved_username');
            if (cachedUsername) {
                currentUsername = cachedUsername;
                document.getElementById('lobbyGreetingName').innerText = currentUsername;
                document.getElementById('localPlayerHeader').innerText = `${currentUsername}`;
                socket.emit('player-login', { username: currentUsername });
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('lobbyScreen').classList.remove('hidden');
            }
            setupLaptopKeyboardListeners();
        });

        // Captures data streams from database hooks and paints the ranking data rows
        socket.on('leaderboard-data', (topPlayersList) => {
            const container = document.getElementById('leaderboardRowsContainer');
            if (!container) return;
            container.innerHTML = "";

            if (topPlayersList.length === 0) {
                container.innerHTML = `<div style="text-align:center; font-size:0.8rem; color:#888;">No scores logged yet. Be the first!</div>`;
                return;
            }

            topPlayersList.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = "leaderboard-row";
                row.innerHTML = `
                    <span><strong>#${index + 1}</strong> ${player.username}</span>
                    <span style="color:var(--sub-text); font-weight:bold;">${player.chips} pts</span>
                `;
                container.appendChild(row);
            });
        });

        function handleManualFormLogin() {
            const usernameInput = document.getElementById('usernameInput');
            if (!usernameInput) return;
            const val = usernameInput.value.trim();
            if(!val) { alert("Please input a valid player name."); return; }
            
            currentUsername = val;
            localStorage.setItem('tetris_saved_username', currentUsername);
            document.getElementById('lobbyGreetingName').innerText = currentUsername;
            document.getElementById('localPlayerHeader').innerText = `${currentUsername}`;
            
            socket.emit('player-login', { username: currentUsername });
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.remove('hidden');
        }

        function handleSignOutAndForget() {
            localStorage.removeItem('tetris_saved_username');
            currentUsername = "";
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }

        function enterRoomArena(roomId) {
            currentActiveRoomId = roomId;
            socket.emit('join-room', { roomId: roomId, username: currentUsername, chips: userChipsBalance });
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('chatLog').innerHTML = "";
            restartLocalGame();
        }
        function leaveCurrentRoom() {
            socket.emit('leave-room');
            gameActive = false;
            if (matchTimerCountdownId) clearInterval(matchTimerCountdownId);
            if (gameEngineTickIntervalId) clearInterval(gameEngineTickIntervalId);
            
            document.getElementById('lossOverlay').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('lobbyScreen').classList.remove('hidden');
            currentActiveRoomId = null;
        }

        function handleModeChange(value) {
            selectedPlayMode = value;
            lastSelectedMode = value;
            
            const oppWrapper = document.getElementById('opponentWrapper');
            if (selectedPlayMode === "competition") {
                oppWrapper.classList.remove('hidden');
            } else {
                oppWrapper.classList.add('hidden');
            }
            restartLocalGame();
        }

        function setupLaptopKeyboardListeners() {
            window.addEventListener('keydown', (event) => {
                if (!gameActive) return;
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
                    event.preventDefault();
                }

                if (event.key === 'ArrowLeft') { mockBlockX = Math.max(0, mockBlockX - 1); } 
                else if (event.key === 'ArrowRight') { mockBlockX = Math.min(9, mockBlockX + 1); } 
                else if (event.key === 'ArrowDown') { mockBlockY = Math.min(19, mockBlockY + 1); } 
                else if (event.key === ' ') { mockBlockY = 19; }

                drawLocalGameBlocks();
            });
        }

        function handleMobileAction(actionType) {
            if (!gameActive) return;
            if (actionType === 'LEFT') { mockBlockX = Math.max(0, mockBlockX - 1); }
            if (actionType === 'RIGHT') { mockBlockX = Math.min(9, mockBlockX + 1); }
            if (actionType === 'DROP') { mockBlockY = 19; }
            
            drawLocalGameBlocks();
        }

        function sendChatMessage() {
            const inp = document.getElementById('chatInput');
            if (!inp) return;
            const txt = inp.value.trim();
            if(!txt) return;
            socket.emit('send-chat', { user: currentUsername, text: txt });
            inp.value = "";
        }

        socket.on('receive-chat', (msg) => {
            if (msg.user === 'SYSTEM') return;
            const log = document.getElementById('chatLog');
            if (!log) return;
            const row = document.createElement('div');
            row.className = "chat-msg";
            row.innerHTML = `<span class="user-tag">${msg.user}:</span> <span>${msg.text}</span>`;
            log.appendChild(row);
            log.scrollTop = log.scrollHeight;
        });

        socket.on('room-update', (room) => {
            if (room && room.id === currentActiveRoomId) {
                const totalCount = room.players.length + room.spectators.length;
                document.getElementById('roomPopulationCounter').innerText = totalCount;
            }
        });

        function startMatchTimerSequence() {
            if (matchTimerCountdownId) clearInterval(matchTimerCountdownId);
            gameTimeRemaining = 120;
            updateTimerDisplayUI();

            matchTimerCountdownId = setInterval(() => {
                gameTimeRemaining--;
                updateTimerDisplayUI();
                if (gameTimeRemaining <= 0) {
                    clearInterval(matchTimerCountdownId);
                    triggerGameLoss();
                }
            }, 1000);
        }

        function updateTimerDisplayUI() {
            const timerDisplay = document.getElementById('gameTimer');
            if (!timerDisplay) return;
            let mins = Math.floor(gameTimeRemaining / 60).toString().padStart(2, '0');
            let secs = (gameTimeRemaining % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${mins}:${secs}`;
        }

        function triggerGameLoss() {
            gameActive = false;
            if (gameEngineTickIntervalId) clearInterval(gameEngineTickIntervalId);
            if (matchTimerCountdownId) clearInterval(matchTimerCountdownId);

            if(selectedPlayMode !== 'practice') {
                userChipsBalance += 50; 
                socket.emit('update-wallet-chips', { username: currentUsername, finalChips: userChipsBalance });
            }

            document.getElementById('lossOverlay').classList.remove('hidden');
        }

        function restartLocalGame() {
            document.getElementById('lossOverlay').classList.add('hidden');
            mockBlockX = 4; 
            mockBlockY = 0; 
            gameActive = true;

            startMatchTimerSequence();
            runEngineLoop();
        }

        // Updates falling gravity parameters dynamically!
        function runEngineLoop() {
            if (!gameActive) return;

            mockBlockY++; 
            if (mockBlockY >= 20) {
                mockBlockY = 0;
                triggerGameLoss(); 
                return;
            }

            drawLocalGameBlocks();

            if (selectedPlayMode === "competition") {
                socket.emit('sync-board-matrix', {
                    grid: currentGridMatrix,
                    score: currentPlayerScore,
                    level: currentLevel,
                    lines: totalLinesCleared,
                    curPlayer: currentUsername
                });
            }

            gameEngineTickIntervalId = setTimeout(runEngineLoop, 500);
        }

        function drawLocalGameBlocks() {
            const localCanvas = document.getElementById('localCanvas');
            if (localCanvas) {
                const localCtx = localCanvas.getContext('2d');
                localCtx.clearRect(0, 0, localCanvas.width, localCanvas.height);
                localCtx.fillStyle = "#3498db";
                localCtx.fillRect(mockBlockX * 24, mockBlockY * 20, 24, 20);
            }
        }

        socket.on('init-lobby', (data) => {
            if(data && data.chips) {
                userChipsBalance = data.chips;
            }
        });

        socket.on('spectate-frame', (data) => {
            if (selectedPlayMode !== "competition" || !data.boards) return;
            const opponentId = Object.keys(data.boards).find(id => id !== socket.id);
            if (opponentId) {
                renderOpponentCanvasGrid();
            }
        });

        function renderOpponentCanvasGrid() {
            const oppCanvas = document.getElementById('opponentCanvas');
            if (!oppCanvas) return;
            const oppCtx = oppCanvas.getContext('2d');
            oppCtx.clearRect(0, 0, oppCanvas.width, oppCanvas.height);
            oppCtx.fillStyle = "#e74c3c";
            oppCtx.fillRect(100, 100, 24, 20);
        }
    </script>
</body>
</html>
