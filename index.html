<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Network Arcade Suite</title>
    <!-- Connects directly to your server.js socket infrastructure -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --accent-color: #ff4757;
            --secondary-accent: #2f3542;
            --text-color: #ffffff;
            --sub-text: #c5a059;
            --chat-bg: #151a21;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .hidden { display: none !important; }

        .auth-container, .lobby-container, .game-container {
            background: var(--panel-color);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
        }

        .input-style {
            background: var(--secondary-accent);
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 10px;
            border-radius: 4px;
            font-size: 1rem;
        }

        .btn-style {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-style:hover { background: #ff6b81; }
        .btn-style.secondary { background: #57606f; }
        .btn-style.secondary:hover { background: #747d8c; }

        .mode-select-style {
            background: var(--secondary-accent);
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        /* 10 Room Selection Grid Menu */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        /* Responsive Split Layout: Game Left, Chat Right */
        .arcade-split-workspace {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            margin-top: 15px;
        }

        .game-column-left {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Chat Relocation Window styling layout (Right Side) */
        .chat-column-right {
            flex: 1;
            background: var(--chat-bg);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--secondary-accent);
            min-height: 450px;
        }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            background: #000;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            text-align: left;
            margin-bottom: 10px;
            max-height: 380px;
        }

        .chat-msg { margin-bottom: 6px; font-size: 0.95rem; line-height: 1.4; }
        .system-tag { color: #51e2f5; font-weight: bold; font-style: italic; }
        .user-tag { color: var(--accent-color); font-weight: bold; }

        /* Boards Side-by-Side Area Configuration */
        .boards-layout-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .canvas-wrapper {
            position: relative;
            text-align: center;
        }

        canvas {
            background-color: #000;
            border: 3px solid var(--secondary-accent);
            border-radius: 6px;
            max-width: 100%;
            height: auto;
        }

        /* Mobile Screen On-Screen Game Controls Area */
        .touch-controls-pad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 320px;
            margin-top: 12px;
        }

        .touch-btn {
            background: var(--secondary-accent);
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 12px 5px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }
        .touch-btn:active { background: var(--accent-color); }

        .game-choice-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            padding: 15px;
            box-sizing: border-box;
            z-index: 10;
        }

        .modal-overlay-shroud {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 99;
        }

        .rules-popup-card {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1e1e2f;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            padding: 25px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 100;
        }

        /* RESPONSIVE BREAKPOINTS: Fit Laptops, Desktops, Tablets, and Cellphones */
        @media (max-width: 850px) {
            .arcade-split-workspace {
                flex-direction: column; /* Stack chat below the game on mobile screens & tablets */
            }
            .chat-column-right {
                min-height: 250px;
            }
        }

        @media (max-width: 480px) {
            body { padding: 5px; }
            .auth-container, .lobby-container, .game-container { padding: 12px; }
            canvas { width: 190px; height: 320px; } /* Adjust canvas slightly smaller on small phone views */
        }
    </style>
</head>
<body>

    <h2>Tetris Network Arcade Suite</h2>

    <!-- IDENTITY SIGN IN -->
    <div id="authScreen" class="auth-container">
        <h3>Choose Player Identity</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="usernameInput" class="input-style" placeholder="Enter Player Name..." style="flex: 1;">
            <button class="btn-style" onclick="handleManualFormLogin()">Enter Arena</button>
        </div>
    </div>

    <!-- 10 MATCHMAKING ROOMS LOBBY SELECTION BOARD -->
    <div id="lobbyScreen" class="lobby-container hidden">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px;">
            <h3>Welcome, <span id="lobbyGreetingName" class="user-tag">Player</span>!</h3>
            <button class="btn-style secondary" onclick="handleSignOutAndForget()">Forget Account Profile</button>
        </div>
        <p>Select a matchmaking arena down below to load into a seat:</p>
        
        <!-- Expanded dynamically to 10 actionable rooms -->
        <div class="rooms-grid">
            <button class="btn-style" onclick="enterRoomArena(1)">Join Room 101</button>
            <button class="btn-style" onclick="enterRoomArena(2)">Join Room 102</button>
            <button class="btn-style" onclick="enterRoomArena(3)">Join Room 103</button>
            <button class="btn-style" onclick="enterRoomArena(4)">Join Room 104</button>
            <button class="btn-style" onclick="enterRoomArena(5)">Join Room 105</button>
            <button class="btn-style" onclick="enterRoomArena(6)">Join Room 106</button>
            <button class="btn-style" onclick="enterRoomArena(7)">Join Room 107</button>
            <button class="btn-style" onclick="enterRoomArena(8)">Join Room 108</button>
            <button class="btn-style" onclick="enterRoomArena(9)">Join Room 109</button>
            <button class="btn-style" onclick="enterRoomArena(10)">Join Room 110</button>
        </div>
    </div>

    <!-- MAIN STRATEGIC GAMEPLAY WORKSPACE DISPLAY -->
    <div id="gameScreen" class="game-container hidden">
        
        <!-- Header Controls Panel Bar Row -->
        <div class="room-controls-row" style="display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--secondary-accent); padding-bottom: 10px;">
            <div>
                <label for="modeSelect" style="font-weight: bold; margin-right: 5px;">Mode:</label>
                <select id="modeSelect" class="mode-select-style" onchange="handleModeChange(this.value)">
                    <option value="single">Single Player Mode</option>
                    <option value="practice">Practice Mode</option>
                    <option value="competition">Competition (Versus)</option>
                    <option value="RULES_TAB">--- 📖 View Rules ---</option>
                </select>
            </div>
