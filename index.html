<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Arcade Network Showdown</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { 
            --bg: #1a1a2e; 
            --panel: #16213e; 
            --accent: #0f3460; 
            --text: #e94560; 
            --white: #fff; 
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Strict lock preventing all page layout scrolls */
            background: var(--bg);
            color: var(--white);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Disables browser multi-tap zooms */
        }
        h1 {
            color: var(--text);
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.4);
            margin: 5px 0 0 0;
            font-size: 18px;
            text-align: center;
            flex-shrink: 0;
        }
        .hidden { display: none !important; }
        
        /* Core Split Framework Configuration */
        .container { 
            display: flex; 
            flex-direction: row; 
            gap: 10px; 
            width: 100%; 
            height: calc(100% - 30px); /* Fill entire remainder height space safely */
            box-sizing: border-box;
            padding: 10px;
        }
        .main-panel { 
            flex: 2; 
            background: var(--panel); 
            border: 2px solid var(--accent); 
            padding: 10px; 
            border-radius: 10px; 
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        .side-panel { 
            flex: 1; 
            background: var(--panel); 
            border: 2px solid var(--accent); 
            padding: 10px; 
            border-radius: 10px; 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
            box-sizing: border-box;
            overflow: hidden;
        }
        
        /* Lobby Room Matrix Adjustments */
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-top: 10px; overflow-y: auto; flex-grow: 1; }
        .room-card { background: var(--accent); padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; }
        
        /* Mathematical Responsive Scaling Arena Wrapper */
        .arena-layout { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
            align-items: center; 
            flex-grow: 1;
            min-height: 0; /* Important fix allowing boxes to scale under flex parents */
        }
        .canvas-wrapper {
            height: 100%;
            max-height: 50vh; /* Limits board canvas height footprints on tiny mobile views */
            aspect-ratio: 10 / 20;
        }
        canvas#tetris-canvas { 
            width: 100%; 
            height: 100%; 
            background: #000; 
            border: 2px solid var(--accent); 
            border-radius: 5px; 
            display: block; 
        }
        
        /* Mobile Touch Screen Control Grid */
        .mobile-controls-dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 220px;
            margin: 8px auto 0 auto;
            flex-shrink: 0;
        }
        .btn-touch {
            background: var(--accent);
            color: #fff;
            border: 1px solid #1f4068;
            border-radius: 8px;
            padding: 12px 0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 3px 0 #0b1d3a;
        }
        .btn-touch:active {
            background: var(--text);
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0b1d3a;
        }
        
        /* Absolute No-Scroll Chat UI Parameters */
        .chat-logs { flex-grow: 1; overflow-y: auto; background: #000; border-radius: 5px; padding: 8px; margin-bottom: 8px; font-size: 12px; border: 1px solid var(--accent); min-height: 0; }
        .chat-input-row { display: flex; gap: 5px; flex-shrink: 0; }
        .chat-input-row input { flex-grow: 1; padding: 8px; border-radius: 4px; border: none; background: #0b132b; color: #fff; font-size: 13px; }
        .chat-input-row button { width: auto; padding: 8px 12px; margin: 0; font-size: 13px; }
        
        .spec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 10px; overflow-y: auto; }
        .spec-view-card { background: #000; border: 1px solid var(--accent); padding: 4px; font-size: 10px; text-align: center; }
        
        button { background: var(--text); color: white; border: none; padding: 10px; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; background: var(--accent); color: #fff; border: 1px solid #222; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        
        /* Mobile Portrait Cross-Platform Overrides */
        @media (max-width: 580px) {
            .container { flex-direction: column; gap: 8px; }
            .main-panel { flex: 3; }
            .side-panel { flex: 1.2; min-height: 0; } /* Enforces chat box to split screen natively */
            h1 { font-size: 15px; }
            .arena-layout { gap: 8px; }
            .canvas-wrapper { max-height: 38vh; } /* Prevents game from pushing chat down offscreen */
        }
    </style>
</head>
<body>

    <h1>Tetris Arcade Network Showdown</h1>

    <div class="container">
        <!-- LEFT PANEL (PROFILE / LOBBY ROOMS / ARENA) -->
        <div class="main-panel">
            
            <!-- 1. REGISTRATION CARD -->
            <div id="panel-login" style="margin: auto; width: 100%; max-width: 320px;">
                <h2 style="margin-top:0; font-size:18px; text-align:center;">Profile Registration</h2>
                <label style="font-size:13px;">Choose Username:</label>
                <input type="text" id="user-name-input" value="Player_1">
                <button id="btn-connect" onclick="connectToLobbyNetwork()">Connect to Game Servers</button>
            </div>

            <!-- 2. NETWORK ROOM HUB -->
            <div id="panel-lobby" class="hidden" style="display:flex; flex-direction:column; height:100%;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
                    <h3 style="margin:0; font-size:14px;">Active Game Rooms</h3>
                    <button onclick="startPracticeMode()" style="background:#27ae60; padding:5px 10px; font-size:12px;">Practice ⏱</button>
                </div>
                <div class="room-grid" id="room-list-container"></div>
            </div>

            <!-- 3. FLUID NON-SCROLL GAME ARENA -->
            <div id="panel-game" class="hidden" style="display:flex; flex-direction:column; height:100%;">
                <div style="display:flex; justify-content:space-between; font-size:13px; border-bottom:1px solid var(--accent); padding-bottom:3px; flex-shrink:0;">
                    <div>Match: <span id="txt-room-id" style="color:var(--text); font-weight:bold;">-</span></div>
                    <div>Time: <span id="txt-match-timer" style="color:var(--text); font-weight:bold;">00:00</span></div>
                </div>

                <div class="arena-layout">
                    <div class="canvas-wrapper">
                        <canvas id="tetris-canvas" width="240" height="480"></canvas>
                    </div>
                    <div style="text-align:center; min-width:85px; display:flex; flex-direction:column; gap:5px; height:100%; justify-content:center;">
                        <h6 style="margin: 0; font-size:11px; text-transform:uppercase; color:#aaa;">Next</h6>
                        <canvas id="preview-canvas" width="60" height="60" style="margin:0 auto; background:#000; border:1px solid var(--accent); border-radius:4px;"></canvas>
                        <div style="background:var(--accent); padding:5px; border-radius:4px; font-size:11px; text-align:left; line-height:1.3;">
                            <div>Score:<br><span id="lbl-score" style="font-weight:bold;color:var(--text);">0</span></div>
                        </div>
                        <button onclick="exitActiveRoom()" style="background:#7f8c8d; padding:4px; font-size:11px; margin-top:5px;">Quit</button>
                    </div>
                </div>

                <!-- Touch Control Array -->
                <div class="mobile-controls-dpad">
                    <div class="btn-touch" onclick="triggerTouchAction('left')">◀</div>
                    <div class="btn-touch" onclick="triggerTouchAction('rotate')">↻</div>
                    <div class="btn-touch" onclick="triggerTouchAction('right')">▶</div>
                    <div></div>
                    <div class="btn-touch" onclick="triggerTouchAction('drop')">▼</div>
                    <div></div>
                </div>
            </div>

            <!-- 4. MONITOR CAPTURES -->
            <div id="panel-spectate" class="hidden" style="display:flex; flex-direction:column; height:100%;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
                    <h4 style="margin:0; font-size:13px;">Live Monitor</h4>
                    <button onclick="exitActiveRoom()" style="background:#7f8c8d; padding:4px 8px; font-size:11px;">Exit</button>
                </div>
                <div class="spec-grid" id="spectator-matrix-grid"></div>
            </div>
        </div>

        <!-- RIGHT PANEL / BOTTOM SPLIT (LOBBY CHAT WINDOW) -->
        <div class="side-panel">
            <h4 style="margin:0 0 5px 0; border-bottom:1px solid var(--accent); padding-bottom:3px; color:var(--text); font-size:13px; flex-shrink:0;">Lobby Chat</h4>
            <div class="chat-logs" id="chat-box-logs"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-text-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>
    <script>
        let socket = null;
        let myUsername = "";
        let myChips = 250;
        let activeRoomId = null;
        let isPracticeMode = false;

        const ROW_COUNT = 20, COL_COUNT = 10, BLOCK_SIZE = 24;
        
        const SHAPES = {
            'I': [,,,],
            'J': [,,],
            'L': [,,],
            'O': [,],
            'S': [,,],
            'T': [,,],
            'Z': [,,]
        };
        const COLORS = { 'I': '#00f0f0', 'J': '#0000f0', 'L': '#f0a000', 'O': '#f0f000', 'S': '#00f000', 'T': '#a000f0', 'Z': '#f00000' };

        let canvas, ctx, prevCanvas, prevCtx;
        let grid = [], score = 0, level = 1, lines = 0, timeLeft = 0;
        let gameInterval = null, physicsInterval = null;
        let currentPiece = null, nextPieceKey = "";

        function connectToLobbyNetwork() {
            myUsername = document.getElementById('user-name-input').value.trim();
            if(!myUsername) return alert("Please type a valid username");

            socket = io(window.location.origin);

            socket.on('init-lobby', (data) => {
                myUsername = data.username; myChips = data.chips;
                document.getElementById('panel-login').classList.add('hidden');
                document.getElementById('panel-lobby').classList.remove('hidden');
                renderLobbyRooms(data.rooms);
                
                const logs = document.getElementById('chat-box-logs');
                logs.innerHTML = data.chat.map(m => `<div>[${m.time}] <b>${m.user}:</b> ${m.text}</div>`).join('');
                logs.scrollTop = logs.scrollHeight;
            });

            socket.on('receive-chat', (m) => {
                const logs = document.getElementById('chat-box-logs');
                logs.innerHTML += `<div>[${m.time}] <b>${m.user}:</b> ${m.text}</div>`;
                logs.scrollTop = logs.scrollHeight;
            });

            socket.on('spectate-joined', ({ room }) => {
                document.getElementById('panel-lobby').classList.add('hidden');
                document.getElementById('panel-spectate').classList.remove('hidden');
                setupSpectatorViews(room.players);
            });

            socket.on('spectate-frame', ({ boards }) => { renderSpectatedFrames(boards); });
        }

        function renderLobbyRooms(rooms) {
            const container = document.getElementById('room-list-container');
            container.innerHTML = "";
            Object.values(rooms).forEach(r => {
                const card = document.createElement('div');
                card.className = 'room-card';
                card.onclick = () => joinRoomIdSlot(r.id);
                card.innerHTML = `<h5 style="margin:0; font-size:13px;">Room ${r.id}</h5><div style="font-size:11px;color:#bbb;">${r.players.length}/6</div>`;
                container.appendChild(card);
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-text-input');
            if(!input.value.trim()) return;
            socket.emit('send-chat', { user: myUsername, text: input.value });
            input.value = "";
        }

        function joinRoomIdSlot(id) {
            activeRoomId = id; isPracticeMode = false;
            socket.emit('join-room', { roomId: id, username: myUsername, chips: myChips });
            launchLocalGameWindow(`Room ${id}`);
        }

        function startPracticeMode() { isPracticeMode = true; launchLocalGameWindow("Practice"); }
        function launchLocalGameWindow(titleText) {
            document.getElementById('panel-lobby').classList.add('hidden');
            document.getElementById('panel-game').classList.remove('hidden');
            document.getElementById('txt-room-id').innerText = titleText;

            canvas = document.getElementById('tetris-canvas'); ctx = canvas.getContext('2d');
            prevCanvas = document.getElementById('preview-canvas'); prevCtx = prevCanvas.getContext('2d');

            timeLeft = isPracticeMode ? 60 : 240; score = 0; level = 1; lines = 0;
            grid = Array.from({length: ROW_COUNT}, () => new Array(COL_COUNT).fill(0));

            generateNextPieceKey(); spawnPiece();
            clearInterval(gameInterval); clearInterval(physicsInterval);
            gameInterval = setInterval(gameClockTick, 1000);
            physicsInterval = setInterval(moveDown, 800);
        }

        function generateNextPieceKey() {
            const keys = Object.keys(SHAPES);
            nextPieceKey = keys[Math.floor(Math.random() * keys.length)];
            drawPreview();
        }

        function spawnPiece() {
            const key = nextPieceKey; generateNextPieceKey();
            currentPiece = { matrix: JSON.parse(JSON.stringify(SHAPES[key])), color: COLORS[key], y: 0, x: 3 };
            if (checkCollide(0, 0, currentPiece.matrix)) {
                clearInterval(gameInterval); clearInterval(physicsInterval);
                alert("Round Complete! Score: " + score);
                exitActiveRoom();
            }
        }

        function checkCollide(xOffset, yOffset, matrix) {
            for(let r=0; r<matrix.length; r++) {
                for(let c=0; c<matrix[r].length; c++) {
                    if(matrix[r][c]) {
                        let nx = currentPiece.x + c + xOffset;
                        let ny = currentPiece.y + r + yOffset;
                        if(nx < 0 || nx >= COL_COUNT || ny >= ROW_COUNT) return true;
                        if(ny >= 0 && grid[ny][nx]) return true;
                    }
                }
            }
            return false;
        }

        function moveDown() {
            if(!checkCollide(0, 1, currentPiece.matrix)) { currentPiece.y++; } 
            else { lockAndMerge(); clearRows(); spawnPiece(); }
            drawArena(); syncStateToNetwork();
        }

        function lockAndMerge() {
            for(let r=0; r<currentPiece.matrix.length; r++) {
                for(let c=0; c<currentPiece.matrix[r].length; c++) {
                    if(currentPiece.matrix[r][c] && currentPiece.y + r >= 0) {
                        grid[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
                    }
                }
            }
        }

        function clearRows() {
            for(let r = ROW_COUNT-1; r>=0; r--) {
                if(grid[r].every(v => v !== 0)) {
                    grid.splice(r, 1); grid.unshift(new Array(COL_COUNT).fill(0));
                    score += 100; lines++; r++;
                }
            }
            document.getElementById('lbl-score').innerText = score;
        }

        function gameClockTick() {
            if(timeLeft <= 0) { exitActiveRoom(); return; }
            timeLeft--;
            let mins = Math.floor(timeLeft / 60), secs = timeLeft % 60;
            document.getElementById('txt-match-timer').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }

        function syncStateToNetwork() {
            if(!isPracticeMode && socket) socket.emit('sync-board-matrix', { grid, score, level, lines, curPlayer: myUsername });
        }

        function drawArena() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for(let r=0; r<ROW_COUNT; r++) {
                for(let c=0; c<COL_COUNT; c++) {
                    if(grid[r][c]) { ctx.fillStyle = grid[r][c]; ctx.fillRect(c*BLOCK_SIZE, r*BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1); }
                }
            }
            if(currentPiece) {
                ctx.fillStyle = currentPiece.color;
                for(let r=0; r<currentPiece.matrix.length; r++) {
                    for(let c=0; c<currentPiece.matrix[r].length; c++) {
                        if(currentPiece.matrix[r][c]) ctx.fillRect((currentPiece.x+c)*BLOCK_SIZE, (currentPiece.y+r)*BLOCK_SIZE, BLOCK_SIZE-1, BLOCK_SIZE-1);
                    }
                }
            }
        }

        function drawPreview() {
            prevCtx.clearRect(0,0,prevCanvas.width,prevCanvas.height);
            prevCtx.fillStyle = COLORS[nextPieceKey];
            const matrix = SHAPES[nextPieceKey];
            for(let r=0; r<matrix.length; r++) {
                for(let c=0; c<matrix[r].length; c++) {
                    if(matrix[r][c]) prevCtx.fillRect(c*12 + 6, r*12 + 6, 11, 11);
                }
            }
        }

        function triggerTouchAction(actionType) {
            if(!currentPiece) return;
            if(actionType === 'left' && !checkCollide(-1, 0, currentPiece.matrix)) currentPiece.x--;
            if(actionType === 'right' && !checkCollide(1, 0, currentPiece.matrix)) currentPiece.x++;
            if(actionType === 'drop') moveDown();
            if(actionType === 'rotate') rotateMatrix();
            drawArena();
        }

        document.addEventListener('keydown', e => {
            if(e.key === 'ArrowLeft' || e.key === 'a') triggerTouchAction('left');
            if(e.key === 'ArrowRight' || e.key === 'd') triggerTouchAction('right');
            if(e.key === 'ArrowDown' || e.key === 's') triggerTouchAction('drop');
            if(e.key === 'ArrowUp' || e.key === 'w') triggerTouchAction('rotate');
        });

        function rotateMatrix() {
            const matrix = currentPiece.matrix, n = matrix.length;
            let temp = Array.from({length:n}, () => new Array(n).fill(0));
            for(let r=0; r<n; r++) { for(let c=0; c<n; c++) temp[c][n-1-r] = matrix[r][c]; }
            if(!checkCollide(0,0,temp)) currentPiece.matrix = temp;
        }

        function setupSpectatorViews(playersList) {
            document.getElementById('spectator-matrix-grid').innerHTML = playersList.map(p => `
                <div class="spec-view-card"><h5>${p.name}</h5><canvas id="canvas-spec-${p.name}" width="80" height="160"></canvas></div>
            `).join('');
        }

        function renderSpectatedFrames(boards) {
            Object.keys(boards).forEach(sid => {
                const b = boards[sid]; const c = document.getElementById(`canvas-spec-${b.curPlayer}`);
                if(c) {
                    const sCtx = c.getContext('2d'); sCtx.clearRect(0,0,80,160);
                    for(let r=0; r<ROW_COUNT; r++) {
                        for(let cGrid=0; cGrid<COL_COUNT; cGrid++) {
                            if(b.grid[r] && b.grid[r][cGrid]) { sCtx.fillStyle = b.grid[r][cGrid]; sCtx.fillRect(cGrid*8, r*8, 7, 7); }
                        }
                    }
                }
            });
        }

        function exitActiveRoom() { clearInterval(gameInterval); clearInterval(physicsInterval); location.reload(); }
    </script>
</body>
</html>
